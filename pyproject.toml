[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studymate-schedule"
version = "0.1.0"
description = "StudyMate schedule and calendar module assigned to shulun in the team PRD"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "sqlalchemy>=2,<3", "httpx>=0.28,<1",
  "uvicorn>=0.30,<1", "psycopg[binary]>=3,<4", "tzdata>=2026.1",
  "cryptography>=44",
  "jinja2>=3.1,<4", "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["schedule_service*", "app*"]

[tool.setuptools.package-data]
schedule_service = ["demo_view.html"]
app = ["templates/*.html", "templates/partials/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
