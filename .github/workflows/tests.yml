name: Python tests
on:
  push:
    branches: [main, shuluun]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-calendar-lock.txt
      - run: python -m pip install -r requirements-calendar-dev.txt -c requirements-calendar-lock.txt
      - run: python -m pip check
      - run: python -c "from pathlib import Path; Path('.tmp').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp=.tmp/ci-tests
