<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyMate{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">StudyMate</a>
    <nav class="site-nav" aria-label="Sections">
      <a href="/profile" {% if nav == "profile" %}aria-current="page"{% endif %}>Profile</a>
      <a href="/schedule" {% if nav == "schedule" %}aria-current="page"{% endif %}>Schedule</a>
      <a href="/matching" {% if nav == "matching" %}aria-current="page"{% endif %}>Matching</a>
      <a href="/session" {% if nav == "session" %}aria-current="page"{% endif %}>Session</a>
      <a href="/invite/demo" {% if nav == "invite" %}aria-current="page"{% endif %}>Invite</a>
      <a href="/style" {% if nav == "style" %}aria-current="page"{% endif %}>Style</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
