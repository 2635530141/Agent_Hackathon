<article class="card proposal">
  <header>
    <div class="person">
      <strong>{{ proposal.people[0].name }}</strong>
      <span class="meta">{{ proposal.people[0].detail }}</span>
    </div>
    <span class="meta">{{ when }}</span>
  </header>
  <p>{{ proposal.place.name }} · {{ proposal.place.address }}</p>
  <p class="hint">{{ proposal.reason }}</p>
  {% if interactive %}
  <form method="post" action="/session/draft" class="stack">
    <input type="hidden" name="course_id" value="{{ course.id }}">
    <input type="hidden" name="starts_at" value="{{ starts_at }}">
    <input type="hidden" name="ends_at" value="{{ ends_at }}">
    <input type="hidden" name="place_type" value="{{ place_type }}">
    <input type="hidden" name="note" value="{{ note }}">
    <input type="hidden" name="study_anyway" value="{{ '1' if study_anyway else '0' }}">
    <label class="field">
      <span class="label">Invite</span>
      <textarea name="invite">{{ proposal.invite }}</textarea>
    </label>
    <div class="cluster">
      <button class="button quiet" type="submit">Save draft</button>
      <button class="button quiet" type="submit" formaction="/session/swap-person">Swap person</button>
      <button class="button quiet" type="submit" formaction="/session/swap-place">Swap place</button>
      <button class="button primary" type="submit" formaction="/session/confirm">Send invite</button>
    </div>
  </form>
  {% else %}
  <label class="field">
    <span class="label">Invite</span>
    <textarea readonly>{{ proposal.invite }}</textarea>
  </label>
  <div class="cluster">
    <button class="button quiet" type="button">Swap person</button>
    <button class="button quiet" type="button">Swap place</button>
    <button class="button primary" type="button">Send invite</button>
  </div>
  {% endif %}
</article>
